[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quick-transfer-cli"
version = "0.1.0"
description = "Interactive Rich CLI for the Quick Transfer API"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "rich>=13.7,<15",
    "platformdirs>=4,<5",
]

[project.scripts]
quick-transfer = "quick_transfer_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]